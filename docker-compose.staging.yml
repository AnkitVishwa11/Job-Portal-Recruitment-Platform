version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: job-portal-staging-mongodb
    restart: unless-stopped
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_DATABASE: jobportal_staging
    volumes:
      - mongodb_staging_data:/data/db
      - mongodb_staging_config:/data/configdb
    networks:
      - job-portal-staging-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-portal-staging-backend
    restart: unless-stopped
    ports:
      - '5001:5000'
    environment:
      NODE_ENV: staging
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/jobportal_staging
      JWT_SECRET: ${JWT_SECRET:-staging_jwt_secret}
      JWT_EXPIRE: 30m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-staging_refresh_secret}
      JWT_REFRESH_EXPIRE: 7d
      COOKIE_SECRET: ${COOKIE_SECRET:-staging_cookie_secret}
      CLIENT_URL: http://localhost:3001
      MAX_FILE_SIZE: 5242880
      UPLOAD_PATH: uploads
    volumes:
      - uploads_staging_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - job-portal-staging-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job-portal-staging-frontend
    restart: unless-stopped
    ports:
      - '3001:80'
    environment:
      REACT_APP_API_URL: http://localhost:5001/api
    depends_on:
      - backend
    networks:
      - job-portal-staging-network

volumes:
  mongodb_staging_data:
    driver: local
  mongodb_staging_config:
    driver: local
  uploads_staging_data:
    driver: local

networks:
  job-portal-staging-network:
    driver: bridge


